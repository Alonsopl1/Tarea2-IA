services:
  zoologic:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      ZOOLOGIC_HOST: 0.0.0.0
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    depends_on:
      - ollama
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
volumes:
  ollama_models:
